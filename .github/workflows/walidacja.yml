name: walidacja

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    # Konfiguracja Trunka (.trunk/) jest lokalna dla autora i nie wchodzi do repozytorium,
    # więc te dwa lintery, jedyne dotyczące plików kursu, muszą działać tutaj.
    # Wersje trzymane zgodnie z .trunk/trunk.yaml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skrypty powłoki (shellcheck)
        run: shellcheck narzedzia/*.sh narzedzia/testy-behawioralne/*.sh

      - name: Definicje workflow (actionlint)
        env:
          WERSJA: 1.7.12
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${WERSJA}/actionlint_${WERSJA}_linux_amd64.tar.gz" \
            | tar -xz actionlint
          ./actionlint

  walidacja:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Nagłówki YAML lekcji, skilli i agenta
        run: ruby narzedzia/sprawdz-frontmatter.rb

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Przykłady .cs i narzędzie postep kompilują się na .NET 10
        run: bash narzedzia/sprawdz-przyklady.sh

      - name: Narzędzie postep odrzuca błędne operacje bez zmiany stanu
        run: bash narzedzia/testy-postep.sh
